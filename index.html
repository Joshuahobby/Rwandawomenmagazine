    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">

    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              primary: "#d800b4", // Vibrant pink from prompt
              "background-light": "#fdfbf7", // Warm off-white
              "background-dark": "#1a1a1a", // Soft black
              "surface-light": "#f4f1ea",
              "surface-dark": "#262626",
              "text-light": "#1f1f1f",
              "text-dark": "#e5e5e5",
            },
            fontFamily: {
              sans: ["Inter", "sans-serif"],
              display: ["Playfair Display", "serif"],
            },
            animation: {
              'fade-in': 'fadeIn 0.5s ease-out',
            },
            keyframes: {
              fadeIn: {
                '0%': { opacity: '0', transform: 'translateY(10px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
            }
          },
        },
      }
    </script>
    <style>
      body {
        -webkit-font-smoothing: antialiased;

      }
      .editorial-text {
          line-height: 1.1;
          letter-spacing: -0.02em;
      }
      /* Hide scrollbar for Chrome, Safari and Opera */

      /* Hide scrollbar for IE, Edge and Firefox */
